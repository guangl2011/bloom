name: intake-template-tests

on:
  pull_request:
    paths:
      - "templates/**"
      - "tools/intake/**"
      - "tests/intake/**"
      - ".github/workflows/intake-template-tests.yml"
  push:
    branches:
      - "release/**"
    paths:
      - "templates/**"
      - "tools/intake/**"
      - "tests/intake/**"

jobs:
  roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - run: python3 -m unittest discover -s tests -t . -v
